# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/tools/overview
php-version = "8.3.0"

[source]
workspace = "."
paths = ["src", "tests", "demos"]
includes = []
excludes = []

[formatter]
print-width = 140
tab-width = 4
use-tabs = false

[linter]
integrations = ["phpunit"]

[linter.rules]
ambiguous-function-call = { enabled = false }
literal-named-argument = { enabled = false }
assert-description = { enabled = false }
assertion-style = { style = "this" }
strict-assertions = { enabled = false }
single-class-per-file = { enabled = false }
excessive-parameter-list = { enabled = false }
no-empty = { enabled = false }
no-error-control-operator = { enabled = false }
# Disabled: idiomatic PHP false-positives (isset, session ini_set, ?:)
no-isset = { enabled = false }
no-ini-set = { enabled = false }
no-shorthand-ternary = { enabled = false }
# Disabled: low-value style (temporary variable aids phpstan @var)
inline-variable-return = { enabled = false }
# Disabled: chained assignment is intentional here (cookies snapshot)
no-multi-assignments = { enabled = false }
cyclomatic-complexity = { threshold = 150 }
kan-defect = { threshold = 12 }
too-many-methods = { threshold = 80 }
too-many-properties = { threshold = 50 }
halstead = { effort-threshold = 12000, difficulty-threshold = 30 }

[analyzer]
find-unused-definitions = true
find-unused-expressions = false
analyze-dead-code = false
memoize-properties = true
allow-possibly-undefined-array-keys = true
check-throws = false
check-missing-override = false
find-unused-parameters = false
strict-list-index-checks = false
no-boolean-literal-comparison = false
check-missing-type-hints = false
register-super-globals = true

# The graph is locked by responsibilities, not by a full dependency matrix:
# Core composes everything, Test is a consumer-facing toolkit, and no other
# production layer may depend on Core or on Test.
[guard]
mode = "perimeter"

[guard.perimeter]

# Kaly\Test may depend on anything; nothing restricts it below.
[[guard.perimeter.restrictions]]
dependency = "Kaly\\Core\\**"
deny-from = [
    "Kaly\\Auth\\**",
    "Kaly\\Http\\**",
    "Kaly\\Router\\**",
    "Kaly\\Asset\\**",
    "Kaly\\I18n\\**",
    "Kaly\\View\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Crypto\\**",
    "Kaly\\Task\\**",
    "Kaly\\Util\\**",
    "Kaly\\Validation\\**",
    "Kaly\\Debug\\**",
]
reason = "Core is the composition layer: it depends on every layer, no layer depends on it. Move the shared piece down, or let Core inject it."

[[guard.perimeter.restrictions]]
dependency = "Kaly\\Test\\**"
deny-from = [
    "Kaly\\Core\\**",
    "Kaly\\Http\\**",
    "Kaly\\Router\\**",
    "Kaly\\Asset\\**",
    "Kaly\\I18n\\**",
    "Kaly\\View\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Crypto\\**",
    "Kaly\\Task\\**",
    "Kaly\\Util\\**",
    "Kaly\\Validation\\**",
    "Kaly\\Debug\\**",
    "Kaly\\Auth\\**",
]
reason = "Kaly\\Test is a toolkit for application tests: production code never depends on it."

# The remaining layers form an explicit order: a layer may depend on the ones
# below it, never the reverse. Util and Clock are foundations, Log, Crypto and
# Validation build on them, Http is the protocol, Router/Asset/I18n/View/Auth are
# domains, Core composes everything. Encoding the order this way also makes a
# cycle impossible outside Core and Test, and outside the Util/Clock pair, which
# are peer foundations.
#
#   Util, Clock                       foundations
#   Log, Crypto, Validation           foundations + Util
#   Http                              protocol; foundations + Log, Validation
#   Router, Asset, I18n, View, Auth   domains; Http + foundations
#   Core                              composition; everything
#   Test                              toolkit; everything (unrestricted)
#
# Validation sits above Util rather than beside it: Http maps input through it.
# This is a deliberate correction of the first plan, which placed it lower.
#
# Debug and Task stand apart: they depend on no Kaly layer (Debug only on
# Kaly\Ex, Task only on kaly-di) and only Core and Test may depend on them.
# Auth, Validation, Debug and Task are mutually independent: none imports another.
# Http is the only legitimate link between Auth and Validation.
#
# Mago has no allow-list: what a namespace may not import is written in the
# deny-from of each layer it must not reach, and who may not import it in its
# own rule below.

[[guard.perimeter.restrictions]]
dependency = "Kaly\\Log\\**"
deny-from = [
    "Kaly\\Util\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Validation\\**",
    "Kaly\\Debug\\**",
    "Kaly\\Task\\**",
]
reason = "Layers only depend downward (Util, Clock < Log, Crypto, Validation < Http < Router, Asset, I18n, View, Auth < Core): move the shared piece to the lower layer instead."

[[guard.perimeter.restrictions]]
dependency = "Kaly\\Crypto\\**"
deny-from = [
    "Kaly\\Util\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Validation\\**",
    "Kaly\\Debug\\**",
    "Kaly\\Task\\**",
]
reason = "Layers only depend downward (Util, Clock < Log, Crypto, Validation < Http < Router, Asset, I18n, View, Auth < Core): move the shared piece to the lower layer instead."

