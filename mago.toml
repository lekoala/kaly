# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/tools/overview
php-version = "8.3.0"

[source]
workspace = "."
paths = ["src", "tests", "demos"]
includes = []
excludes = []

[formatter]
print-width = 140
tab-width = 4
use-tabs = false

[linter]
integrations = ["phpunit"]

[linter.rules]
ambiguous-function-call = { enabled = false }
literal-named-argument = { enabled = false }
assert-description = { enabled = false }
assertion-style = { style = "this" }
strict-assertions = { enabled = false }
single-class-per-file = { enabled = false }
excessive-parameter-list = { enabled = false }
no-empty = { enabled = false }
no-error-control-operator = { enabled = false }
# Disabled: idiomatic PHP false-positives (isset, session ini_set, ?:)
no-isset = { enabled = false }
no-ini-set = { enabled = false }
no-shorthand-ternary = { enabled = false }
# Disabled: low-value style (temporary variable aids phpstan @var)
inline-variable-return = { enabled = false }
# Disabled: chained assignment is intentional here (cookies snapshot)
no-multi-assignments = { enabled = false }
cyclomatic-complexity = { threshold = 150 }
kan-defect = { threshold = 12 }
too-many-methods = { threshold = 80 }
too-many-properties = { threshold = 50 }
halstead = { effort-threshold = 12000, difficulty-threshold = 30 }

[analyzer]
find-unused-definitions = true
find-unused-expressions = false
analyze-dead-code = false
memoize-properties = true
allow-possibly-undefined-array-keys = true
check-throws = false
check-missing-override = false
find-unused-parameters = false
strict-list-index-checks = false
no-boolean-literal-comparison = false
check-missing-type-hints = false
register-super-globals = true

# The graph is locked by responsibilities, not by a full dependency matrix:
# Core composes everything, Test is a consumer-facing toolkit, and no other
# production layer may depend on Core or on Test.
[guard]
mode = "perimeter"

[guard.perimeter]

# Kaly\Test may depend on anything; nothing restricts it below.
[[guard.perimeter.restrictions]]
dependency = "Kaly\\Core\\**"
deny-from = [
    "Kaly\\Auth\\**",
    "Kaly\\Http\\**",
    "Kaly\\Router\\**",
    "Kaly\\Asset\\**",
    "Kaly\\I18n\\**",
    "Kaly\\View\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Util\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Kaly\\Test\\**"
deny-from = [
    "Kaly\\Core\\**",
    "Kaly\\Http\\**",
    "Kaly\\Router\\**",
    "Kaly\\Asset\\**",
    "Kaly\\I18n\\**",
    "Kaly\\View\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Util\\**",
]

# The remaining layers form an explicit order: a layer may depend on the ones
# below it, never the reverse. Util and Clock are foundations, Log builds on
# them, Http is the protocol, Router/Asset/I18n/View are domains, Core composes
# everything. Encoding the order this way also makes a cycle impossible outside
# Core and Test, and outside the Util/Clock pair, which are peer foundations.
#
#   Util, Clock                  foundations
#   Log                          foundations + Util
#   Http                         protocol; foundations + Log
#   Router, Asset, I18n, View    domains; Http + foundations
#   Core                         composition; everything
#   Test                         toolkit; everything (unrestricted)

[[guard.perimeter.restrictions]]
dependency = "Kaly\\Log\\**"
deny-from = [
    "Kaly\\Util\\**",
    "Kaly\\Clock\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Kaly\\Http\\**"
deny-from = [
    "Kaly\\Util\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Kaly\\Router\\**"
deny-from = [
    "Kaly\\Util\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Http\\**",
    "Kaly\\Asset\\**",
    "Kaly\\I18n\\**",
    "Kaly\\View\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Kaly\\Asset\\**"
deny-from = [
    "Kaly\\Util\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Http\\**",
    "Kaly\\Router\\**",
    "Kaly\\I18n\\**",
    "Kaly\\View\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Kaly\\I18n\\**"
deny-from = [
    "Kaly\\Util\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Http\\**",
    "Kaly\\Router\\**",
    "Kaly\\Asset\\**",
    "Kaly\\View\\**",
]

[[guard.perimeter.restrictions]]
dependency = "Kaly\\View\\**"
deny-from = [
    "Kaly\\Util\\**",
    "Kaly\\Clock\\**",
    "Kaly\\Log\\**",
    "Kaly\\Http\\**",
    "Kaly\\Router\\**",
    "Kaly\\Asset\\**",
    "Kaly\\I18n\\**",
]
